
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Chat com Marília</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ece5dd; margin: 0; }
    #chat { padding: 10px; height: 90vh; overflow-y: auto; }
    .msg { margin: 8px 0; padding: 10px; border-radius: 10px; max-width: 80%; }
    .user { background: #dcf8c6; text-align: right; margin-left: auto; }
    .bot { background: #fff; text-align: left; }
    #form { display: flex; padding: 10px; border-top: 1px solid #ccc; background: #fff; }
    #input { flex: 1; padding: 10px; font-size: 16px; border-radius: 20px; border: 1px solid #ccc; }
    #send { margin-left: 10px; padding: 10px 20px; border: none; border-radius: 20px; background: #25d366; color: white; font-weight: bold; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Digite sua mensagem..." autocomplete="off">
    <button id="send" type="submit">Enviar</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    function addMsg(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      if (type === "bot") falar(text);
    }

    function falar(texto) {
      const voz = new SpeechSynthesisUtterance(texto);
      voz.lang = "pt-BR";
      speechSynthesis.speak(voz);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;
      addMsg(msg, "user");
      input.value = "";

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });

      const data = await res.json();
      const resposta = data.choices?.[0]?.message?.content || "Erro na resposta.";
      addMsg(resposta, "bot");
    });
  </script>
</body>
</html>
